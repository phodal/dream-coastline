name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  export:
    name: Export & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download Godot 4.6.2
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.6.2-stable/Godot_v4.6.2-stable_linux.x86_64.zip
          unzip -q Godot_v4.6.2-stable_linux.x86_64.zip
          mv Godot_v4.6.2-stable_linux.x86_64 godot
          chmod +x godot

      - name: Download export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.6.2.stable
          wget -q -O export_templates.tpz \
            https://github.com/godotengine/godot/releases/download/4.6.2-stable/Godot_v4.6.2-stable_export_templates.tpz
          unzip -q export_templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/4.6.2.stable/

      - name: Install release build dependencies
        run: |
          pipx install ziglang
          cargo install cargo-zigbuild --locked

      - name: Run headless player gate
        run: python3 tools/run_automated_tests.py --tier headless --godot ./godot

      - name: Build Linux and Windows release libraries
        run: tools/build_release_libraries.sh

      - name: Run release export gate
        run: python3 tools/run_automated_tests.py --only smoke-export-config,audio-mix-audit,desktop-release-exports --release-platforms windows,linux --godot ./godot

      - name: Package artifacts
        run: |
          cd builds/linux && zip -q dream-coastline-linux.zip dream-coastline.x86_64 dream-coastline.pck && cd -
          cd builds/windows && zip -q dream-coastline-windows.zip "Dream Coastline.exe" "Dream Coastline.pck" && cd -
          unzip -l builds/linux/dream-coastline-linux.zip | grep -F dream-coastline.pck
          unzip -l builds/windows/dream-coastline-windows.zip | grep -F "Dream Coastline.pck"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            builds/linux/dream-coastline-linux.zip
            builds/windows/dream-coastline-windows.zip
          generate_release_notes: true
